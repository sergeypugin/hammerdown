name: CI and Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-libreoffice-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yaml') }}
          restore-keys: |
            apt-libreoffice-${{ runner.os }}-

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

  bump:
    name: Auto-bump version
    # Runs only on pushes to main. Tag pushes are handled by build/release/classify.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version and bump
        shell: bash
        run: |
          set -euo pipefail

          # No tag -> nothing to diff against, skip silently.
          last_tag=$(git tag -l 'v*' --sort=-creatordate | head -n1)
          if [ -z "$last_tag" ]; then
            echo "No previous v* tag found; skipping auto-bump."
            exit 0
          fi

          # Skip when the last commit was authored by an automated bot.
          # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
          # is a defensive guard against looping on bot commits.
          last_commit=$(git log -1 --format='%an|%ae')
          if echo "$last_commit" | grep -qiE 'github-actions\[bot\]|dependabot\[bot\]|hammerdown-release-bot'; then
            echo "Last commit is from a bot; skipping auto-bump."
            exit 0
          fi

          current_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/hammerdown/__init__.py)
          if [ -z "$current_version" ]; then
            echo "Could not read current version; aborting."
            exit 1
          fi

          # A prerelease suffix (for example -pre1) is ignored for the auto-bump
          # base: stable tags are produced by the bot, prereleases are manual.
          major=$(echo "$current_version" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$current_version" | cut -d. -f2)
          patch=$(echo "$current_version" | cut -d. -f3 | cut -d- -f1)

          # Classify the single strongest change across the whole range since the
          # last tag: one bump per release, not one per commit.
          major_bump=0; minor_bump=0; patch_bump=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:'; then
              major_bump=1
            elif echo "$msg" | grep -Eq '^feat(\([^)]*\))?:'; then
              minor_bump=1
            elif echo "$msg" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
              patch_bump=1
            fi
          done < <(git log --format='%s' "${last_tag}..HEAD" || true)

          if [ "$major_bump" -eq 1 ]; then
            new_major=$((major + 1)); new_minor=0; new_patch=0
          elif [ "$minor_bump" -eq 1 ]; then
            new_major=$major; new_minor=$((minor + 1)); new_patch=0
          elif [ "$patch_bump" -eq 1 ]; then
            new_major=$major; new_minor=$minor; new_patch=$((patch + 1))
          else
            echo "No release-worthy commits since $last_tag; skipping auto-bump."
            exit 0
          fi

          new_version="${new_major}.${new_minor}.${new_patch}"
          if [ "$new_version" = "$current_version" ]; then
            echo "Version already $new_version; nothing to bump."
            exit 0
          fi

          sed -i "s/^__version__ = \"\(.*\)\"$/__version__ = \"${new_version}\"/" src/hammerdown/__init__.py

          git config user.name "hammerdown-release-bot"
          git config user.email "hammerdown-release-bot@users.noreply.github.com"

          git add src/hammerdown/__init__.py
          git commit -m "chore(release): bump version to ${new_version}"
          git tag "v${new_version}"

          git push origin HEAD:main "refs/tags/v${new_version}"

  classify:
    name: Classify release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.classify.outputs.stable }}
    steps:
      - name: Classify tag
        id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: hammerdown-linux-x64
            executable: hammerdown-linux-x64
          - os: windows-latest
            asset_name: hammerdown-windows-x64.exe
            executable: hammerdown-windows-x64
          - os: macos-15
            asset_name: hammerdown-macos-arm64
            executable: hammerdown-macos-arm64
          - os: macos-15-intel
            asset_name: hammerdown-macos-x64
            executable: hammerdown-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        env:
          HAMMERDOWN_EXECUTABLE: ${{ matrix.executable }}
        run: python -m PyInstaller --noconfirm --clean hammerdown.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, classify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ./artifacts/* > ./artifacts/SHA256SUMS.txt

      # Stable releases are tagged vX.Y.Z. Any tag with a suffix (for example
      # vX.Y.Z-pre or vX.Y.Z-pre1) is a prerelease: it is never marked latest
      # and is not published to PyPI.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*
          prerelease: ${{ needs.classify.outputs.stable != 'true' }}
          make_latest: ${{ needs.classify.outputs.stable == 'true' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    needs: [test, classify]
    if: startsWith(github.ref, 'refs/tags/v') && needs.classify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/hammerdown/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
