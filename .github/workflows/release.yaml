name: CI and Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-libreoffice-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yaml') }}
          restore-keys: |
            apt-libreoffice-${{ runner.os }}-

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q



  classify:
    name: Classify release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.classify.outputs.stable }}
    steps:
      - name: Classify tag
        id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: hammerdown-linux-x64
            executable: hammerdown-linux-x64
          - os: windows-latest
            asset_name: hammerdown-windows-x64.exe
            executable: hammerdown-windows-x64
          - os: macos-15
            asset_name: hammerdown-macos-arm64
            executable: hammerdown-macos-arm64
          - os: macos-15-intel
            asset_name: hammerdown-macos-x64
            executable: hammerdown-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        env:
          HAMMERDOWN_EXECUTABLE: ${{ matrix.executable }}
        run: python -m PyInstaller --noconfirm --clean hammerdown.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, classify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ./artifacts/* > ./artifacts/SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Extract section for current tag (e.g., v3.1.4 -> 3.1.4)
          VERSION=${GITHUB_REF_NAME#v}
          # Use awk to print from "## [VERSION] - DATE" to next "## [" or EOF
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] -" { in_section=1 }
            in_section && $0 ~ "^## \\[" && !($0 ~ "^## \\[" ver "\\] -") { exit }
            in_section { print }
          ' CHANGELOG.md > release_body.md
          # Remove trailing whitespace
          sed -i 's/[[:space:]]*$//' release_body.md
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Stable releases are tagged vX.Y.Z. Any tag with a suffix (for example
      # vX.Y.Z-pre or vX.Y.Z-pre1) is a prerelease: it is never marked latest
      # and is not published to PyPI.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: ./artifacts/*
          prerelease: ${{ needs.classify.outputs.stable != 'true' }}
          make_latest: ${{ needs.classify.outputs.stable == 'true' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    needs: [test, classify]
    if: startsWith(github.ref, 'refs/tags/v') && needs.classify.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/hammerdown/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
