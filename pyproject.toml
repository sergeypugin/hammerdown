[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hammerdown"
dynamic = ["version"]
description = "Convert documents to Markdown with extracted images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "pymupdf4llm",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "onnxruntime",
    "tiktoken",
    "rich",
]

[project.scripts]
hammerdown = "hammerdown.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "hammerdown",
    "hammerdown.parsers",
    "hammerdown.integrations",
    "hammerdown.parsers.office",
]

[tool.setuptools.package-data]
hammerdown = ["icon.ico", "icon.png", "parsers/symbols.json"]

[tool.setuptools.dynamic]
version = {attr = "hammerdown.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
