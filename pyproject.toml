[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-maker"
version = "1.0.0"
description = "Convert documents to Markdown with extracted images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "pymupdf4llm",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "onnxruntime",
]

[project.scripts]
md-maker = "converter:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
