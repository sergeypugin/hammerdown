[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hammerdown"
dynamic = ["version"]
description = "Convert documents to Markdown with extracted images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf<2",
    "pymupdf4llm<2",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "onnxruntime",
    "tiktoken",
    "rich",
    "beautifulsoup4",
    "lxml",
]

[project.scripts]
hammerdown = "hammerdown.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hammerdown = ["assets/*", "parsers/math/symbols.json"]

[tool.setuptools.dynamic]
version = {attr = "hammerdown.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
